<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Z-Virus Investigation: Filtering Fact from Fiction</title>
<style>

@keyframes bt{to{opacity:1}}.fadein{animation:fi 1.6s ease-in}@keyframes fi{from{opacity:0}}

a{color:var(--blu)}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}h1:focus,h2:focus{outline:none}
#app{max-width:1060px;margin:0 auto;padding:10px 14px 60px}

.batbar i{display:block;height:100%;background:var(--grn);transition:width .4s,background .4s}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:13px}
.hbtn:hover{border-color:var(--grn)}
#timer{height:8px;margin:8px 0 0;border-radius:4px;background:#000;border:1px solid var(--line);overflow:hidden;visibility:hidden}

#say{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 2px;padding:10px 14px;flex:1;min-height:48px}
#say b.nm{color:var(--grn);font-family:var(--mono);font-size:13px;display:block}
h1{font-family:var(--mono);color:var(--grn);font-size:clamp(26px,5vw,44px);line-height:1.1;margin:.3em 0;text-shadow:0 0 18px #5dfc8a55}
h2{font-family:var(--mono);color:var(--grn);font-size:21px;margin:.2em 0 .5em}
h3{font-size:17px;margin:.6em 0 .3em}
.kick{font-family:var(--mono);color:var(--amb);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.btn{background:var(--grn);color:#062010;border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-family:var(--mono)}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{background:#3a4a40;color:#8a9a90;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover:not([disabled]){border-color:var(--grn)}
.opt.sel{border-color:var(--amb);background:#2a2a18}
.opt.ok{border-color:var(--grn);background:#12301c}.opt.ok:before{content:'✓ ';color:var(--grn);font-weight:700}.opt.no:before{content:'✗ ';color:var(--red);font-weight:700}.seg.ok:before{content:'✓ ';color:#1c8a45}.seg.no:before{content:'✗ ';color:#c0392b}
.opt.no{border-color:var(--red);background:#331a1a}
.opt[disabled]{cursor:default}
.fb{border-left:4px solid var(--grn);background:#10241a;padding:10px 14px;border-radius:6px;margin:12px 0}
.fb.bad{border-color:var(--red);background:#2a1616}
.fb.mid{border-color:var(--amb);background:#2a2412}
.grid{display:grid;gap:12px}
@media(min-width:820px){.g2{grid-template-columns:1.7fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

.res:hover{border-color:var(--grn)}
.res .t{color:var(--blu);font-weight:600;text-decoration:underline}
.res .u{font-family:var(--mono);font-size:13px;color:var(--grn)}
.res .s{color:var(--dim);font-size:15px}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin:3px 4px 0 0;color:var(--dim)}
.chip.C{color:var(--grn);border-color:var(--grn)}.chip.Q{color:var(--amb);border-color:var(--amb)}.chip.U{color:var(--red);border-color:var(--red)}
.disk{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;font-family:var(--mono);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.disk.full{border-style:solid;border-color:var(--blu)}
.browser{background:#f4f6f5;color:#16201a;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.bbar{background:#d7ddd9;padding:6px 10px;font-family:var(--mono);font-size:13px;display:flex;gap:8px;align-items:center}
.bbar span{background:#fff;border-radius:14px;padding:2px 12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{padding:12px 14px}
.blk{display:block;width:100%;text-align:left;background:transparent;border:2px solid transparent;border-radius:6px;padding:7px 9px;margin:3px 0;color:inherit}
.blk:first-child{font-weight:700;font-size:19px}
.blk:hover{border-color:#9aa;background:#e8eeea}
.blk.g{border-color:#1c8a45;background:#dff5e6}.blk.r{border-color:#c0392b;background:#fbe3e0}.blk.n{opacity:.6}
.blk small{display:block;font-weight:400;font-size:14.5px;margin-top:4px}
.page.shop,.page.click{background:#fff8d6}.page.news{background:#fff;font-family:Georgia,serif}.page.wiki{background:#f6f7f9}.page.video{background:#ffecec}.page.blog{background:#eee;font-family:Georgia,serif}.page.zine{background:#f3e6ff}.page.corp{background:#e9f1fb}
.vb{font-family:var(--mono);font-weight:700;border-radius:8px;padding:10px 14px;border:2px solid;background:transparent;flex:1;min-width:150px}
.vb.C{border-color:var(--grn);color:var(--grn)}.vb.Q{border-color:var(--amb);color:var(--amb)}.vb.U{border-color:var(--red);color:var(--red)}
.vb:hover{background:#ffffff14}
.pk{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.pk:hover{border-color:var(--grn)}
.pk .i{font-size:36px}
.tcard{background:#f4f6f5;color:#16201a;border-radius:12px;padding:18px;border-left:10px solid var(--blu);font-size:18px}
.tcard .m{font-family:var(--mono);font-size:14px;color:#3b4a41;margin-top:6px}
.cit{background:#f4f6f5;color:#16201a;border-radius:10px;padding:14px;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.9}
.seg{background:#fff;border:2px solid #b9c4bd;border-radius:6px;padding:2px 7px;margin:2px;color:inherit;font:inherit}
.seg:hover:not([disabled]){border-color:#1565c0;background:#e3f0ff}
.seg.ok{border-color:#1c8a45;background:#dff5e6}.seg.no{border-color:#c0392b;background:#fbe3e0}
.slot{min-height:54px;border:2px dashed #8a9;border-radius:8px;padding:6px;margin:8px 0;background:#fff}
select{font:inherit;padding:4px 6px;border-radius:6px;max-width:100%}
.track{display:flex;align-items:flex-end;gap:4px;height:64px;margin:6px 0;border-bottom:3px solid var(--line);position:relative}
.track img{height:60px;position:absolute;bottom:0;transition:left .6s}
.track .door{margin-left:auto;font-size:38px}
table{border-collapse:collapse;width:100%}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right;font-family:var(--mono);white-space:nowrap}
.big{font-family:var(--mono);font-size:54px;color:var(--grn);line-height:1}
.ov{position:absolute;inset:0;background:#000c;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.ov .card{max-width:640px;width:100%;margin:0}
.ov.z{z-index:60}.ov.red .card{border-color:var(--red);box-shadow:0 0 40px #ff6b6b55}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}@keyframes pop{from{transform:scale(.96);opacity:0}}
.ref{padding-left:2em;text-indent:-2em;margin:.5em 0;font-family:Georgia,serif}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.crt{box-shadow:6px 6px 0 #000a}
.tube{background:#fff;color:#111;border:2px solid #e6f2e9;outline:2px solid #111;outline-offset:-4px;position:relative;overflow:hidden;font-family:Geneva,Verdana,"Segoe UI",sans-serif}
.tube:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0000000f 2px 3px),radial-gradient(ellipse at center,#0000 60%,#0003 100%)}
.mbar{background:#fff;border-bottom:2px solid #111;padding:2px 10px;font:700 13px var(--mono);display:flex;gap:14px}.mbar span:last-child{margin-left:auto}
.wbar{display:flex;align-items:center;gap:8px;padding:3px 8px;border-bottom:2px solid #111;background:repeating-linear-gradient(#fff 0 2px,#111 2px 3px);font:700 13px var(--mono)}
.wbar i{width:13px;height:13px;border:2px solid #111;background:#fff;flex:none}.wbar span{background:#fff;padding:0 10px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.tube .bbar{border-bottom:2px solid #111;background:#eee}.tube .bbar span{border:1px solid #111;border-radius:0}
.scroll{padding:6px 8px}
@media(min-width:820px){.scroll{max-height:66vh;overflow-y:auto}}
.chin{display:flex;align-items:center;gap:12px;padding:10px 6px 14px;font:700 11px var(--mono);color:#6d6552}
.chin .led{width:9px;height:9px;border-radius:50%;background:#5dfc8a;box-shadow:0 0 8px #5dfc8a}.chin .fslot{margin-left:auto;width:120px;height:7px;background:#3a372f;border-radius:3px;box-shadow:inset 0 2px 2px #000}
.tube .res{background:#fff;color:#111;border:1px solid #999;border-radius:0}.tube .res:hover{border-color:#111;background:#eef}.tube .res .t{color:#0000c8}.tube .res .u{color:#1c6b33}.tube .res .s{color:#333}
.tube .chip{color:#333;border-color:#777}.tube .chip.C{color:#176b36;border-color:#176b36}.tube .chip.Q{color:#8a5a00;border-color:#8a5a00}.tube .chip.U{color:#b3261e;border-color:#b3261e}
.tube .page{padding:4px}.tube h2{color:#111;font-size:17px;margin:6px 4px}
.side-allie{text-align:center}.side-allie img{width:130px;height:130px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--grn);background:#1d2a22}
#asay{text-align:left;background:var(--panel2);border:1px solid var(--grn);border-radius:14px;padding:10px 12px;margin-top:8px;position:relative}
#asay:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--grn)}
#prog{margin:6px 0 0;display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--dim)}
#prog .pb{flex:1;height:10px;border:1px solid var(--line);border-radius:6px;background:#000;overflow:hidden}#prog .pb i{display:block;height:100%;background:linear-gradient(90deg,#2e9c55,var(--grn));transition:width .5s}
#door{--dc:var(--grn);display:flex;align-items:center;gap:12px;margin:10px 0 0;padding:6px 12px;border:2px solid var(--dc);border-radius:10px;background:#0f1712;font:12px var(--mono);color:var(--dim);box-shadow:0 0 12px color-mix(in srgb,var(--dc) 35%,transparent)}
#door[data-s="3"],#door[data-s="2"]{--dc:var(--amb)}#door[data-s="1"],#door[data-s="0"]{--dc:var(--red);animation:alarm 1s ease-in-out 3}
@keyframes alarm{50%{background:#2a1212}}
#door .dl{flex:none;width:clamp(120px,22vw,190px);line-height:1.3}#door .dl b{display:block;color:var(--dc);font-size:14px;letter-spacing:.08em;text-shadow:0 0 8px var(--dc)}#door .dl span{color:var(--ink)}#door .dl i{display:block;font-style:normal;font-size:11px;color:var(--dim)}
#door .trk{flex:1;position:relative;height:56px;border-bottom:3px dashed #2c4034;min-width:60px}
@media(max-width:600px){#door{gap:8px;padding:6px 8px}#door .dl{width:104px}#door .dl i{display:none}#door .d{font-size:34px}#door .lk{font-size:15px}#door .trk img{height:44px}}
#door .trk img{height:52px;position:absolute;bottom:0;transition:left .8s ease-in-out}
#door .gate{flex:none;display:flex;align-items:center;gap:4px}#door .d{font-size:42px;line-height:1}#door .lk{display:grid;grid-template-columns:1fr 1fr;gap:2px;font-size:18px;line-height:1.1}#door .lk .brk{opacity:.45;filter:grayscale(1) sepia(1) hue-rotate(-50deg) saturate(5);position:relative}#door .lk .brk:after{content:'✕';position:absolute;left:2px;top:-2px;color:var(--red);font:700 17px var(--mono);text-shadow:0 0 4px #000}
#door.hit .trk img{animation:sh .35s 2}#door.hit{animation:hitf .7s}@keyframes hitf{30%{background:#4a1515}}
.eva{display:flex;gap:14px;align-items:flex-start;background:#0d1a24;border:1px solid var(--blu);border-radius:12px;padding:14px;margin:12px 0}
.evai{flex:none;width:104px;height:104px;border-radius:50%;border:3px solid var(--blu);overflow:hidden;background:#000;box-shadow:0 0 22px #6cc4ff66}.evai img{width:100%;height:100%;object-fit:cover;display:block}
body[data-talk=A] #aImg,body[data-talk=A] .side-allie img{animation:talkA 1s ease-in-out infinite}body[data-talk=E] .evai{animation:talkE 1s ease-in-out infinite}
@keyframes talkA{50%{box-shadow:0 0 0 4px #5dfc8a55,0 0 26px #5dfc8acc}}@keyframes talkE{50%{box-shadow:0 0 0 4px #6cc4ff55,0 0 34px #6cc4ffee}}
#aImg,.side-allie img{cursor:pointer}
.eva b.nm{display:block;color:var(--blu);font:700 13px var(--mono)}.eva p{margin:.4em 0}
.wcard{background:#f4f6f5;color:#16201a;border-radius:12px;padding:20px;font-size:20px;text-align:center;border-top:8px solid var(--blu)}
.sbox{border:2px solid #111;padding:8px 10px;font:16px var(--mono);margin:6px 4px;background:#fff}
.kps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:12px 0}.kp{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--grn);border-radius:8px;padding:10px 12px}.kp b{display:block;color:var(--grn);font-family:var(--mono);font-size:14px;margin-bottom:4px}.kp span{font-size:15.5px}
.funnel{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0}.funnel div{background:#12301c;border:1px solid var(--grn);border-radius:6px;padding:6px;text-align:center;font:600 14px var(--mono);color:var(--grn)}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}.trail span{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:3px 12px;font-size:15px}.trail span+span:before{content:'→ ';color:var(--dim)}.trail .q{border-color:var(--amb);color:var(--amb)}
.cmpw{overflow-x:auto}.cmp{border-collapse:collapse;width:100%;font-size:15.5px;margin:10px 0}.cmp th,.cmp td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;font-family:var(--sans)}.cmp td:last-child,.cmp th:last-child{text-align:left;font-family:var(--sans);white-space:normal}.cmp tr:first-child th{background:#12301c;color:var(--grn)}.cmp th[scope=row]{color:var(--amb);white-space:nowrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 10px;margin-top:10px}.tgrid .opt{margin:4px 0}
.steps li{margin:8px 0}code{font-family:var(--mono);background:#000;color:var(--grn);border:1px solid var(--line);border-radius:4px;padding:1px 6px}.tube code{background:#eef;color:#111;border-color:#99a}
.exs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:12px 0}.ex{border-radius:8px;padding:10px 12px;border:1px solid}.ex.good{border-color:var(--grn);background:#10241a}.ex.bad{border-color:var(--red);background:#2a1616}.ex b{font-family:var(--mono)}.ex.good b{color:var(--grn)}.ex.bad b{color:var(--red)}.ex p{font-family:Georgia,serif;margin:.4em 0}.ex small{color:var(--dim);font-size:14px}
.apa span{border-radius:4px;padding:2px 3px}.a1{background:#ffe1a8}.a2{background:#cde8ff}.a3{background:#d9f5d0}.a4{background:#f3d9ff}.a5{background:#ffd6d6}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.legend span{color:#111;border-radius:4px;padding:2px 8px;font:600 13px var(--mono)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="mon"><div class="scrwrap"><div id="scr">
<div id="app">
  <div id="hud" hidden>
    <span class="lv" id="hLv">ZNET</span>
    <span class="bat" title="Allie's battery"><span aria-hidden="true">🔋</span><span class="sr">Allie's battery</span><span class="batbar"><i id="hBar"></i></span><span id="hBat">100%</span></span>
    <span title="Intel points"><span aria-hidden="true">⭐</span><span class="sr">Intel points</span> <span id="hXp">0</span></span>
    <span title="Correct answers in a row"><span aria-hidden="true">🔥</span><span class="sr">Correct in a row</span> <span id="hSt">0</span></span>
    <span title="Zombie attacks stopped"><span aria-hidden="true">🧟</span><span class="sr">Zombie attacks stopped</span> <span id="hZ">0</span></span>
    <span title="Mission score">Score <span id="hGr">0</span>/100</span>
    <button class="hbtn" id="bMan">📖 Field Manual</button>
    <button class="hbtn" id="bVo" aria-pressed="true">🗣 Voices on</button>
    <button class="hbtn" id="bMute" aria-label="Sound effects">🔊</button>

    ['Purpose','Why does it exist?','To inform, with funding disclosed','To sell, persuade or get clicks']].map(r=>'<tr><th scope="row">'+r[0]+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>').join('')+'</table></div>'+
   kp([['Lateral reading','Open a new tab and search for the author, the organization and the claim. What do other trusted sources say about them?'],['Credible is not the same as true','A credible source can still be outdated, biased by funding, or about a different question. Weigh all five checks.']]),'Practice on a page ▶'));
  $('#lnb').onclick=checks;
}

/* ---------- LEVEL 2: THE SOURCE HUNT ---------- */

    quiz($('#q'),{kick:'BioCorp interference',p:"BioCorp claims H17 is 90% effective. Why are we rejecting their data?",o:[{t:'BioCorp has a profit motive and a conflict of interest, and its data has not been peer reviewed.',ok:1},{t:'BioCorp is located in a high-infection zone.',why:'Location has nothing to do with credibility.'},{t:"BioCorp's research is proprietary and too expensive to share.",why:'Cost is not the issue.'}],why:'Ask who benefits. A company selling the cure, with a 10-person trial and no outside review, cannot be your evidence.'},f=>{S.G.bio=f*MAX.bio;

/* ---------- LEVEL 3: RAPID TRIAGE ---------- */
const TRI=12;
function triageIntro(){
  S.lvl=3;S.G.triage=0;setP(52);save();say('Incoming data packets, and not much time. Sort each one. Use your checks: <b>who wrote it, when, and where it was published</b>.');

  $('#go').onclick=()=>{const by=v=>shuffle(CARDS.filter(c=>c.v===v));triage(shuffle([...by('C').slice(0,5),...by('Q').slice(0,4),...by('U').slice(0,3)]),0)};

function triage(deck,i){
  if((i===4||i===8)&&deck.br!==i){deck.br=i;return breach(()=>triage(deck,i))}
  if(i>=deck.length){document.onkeydown=null;S.lvl=4;setP(64);save();return levelDone('Level 3 complete: Rapid Triage',[['Sources sorted correctly (GE.c)','triage']],'Triage complete. Now comes the part most survivors get wrong: using what we found without stealing it or twisting it.',useIntro)}
  const c=deck[i];let done=false,t0=Date.now(),late=false;setP(52+12*i/deck.length);
  if(i>0)say(['Next one. Who wrote it?','Check the date on this one.','Where was this published?','Does anyone profit if we believe this?','Keep going. You are doing the work of a real researcher.'][i%5]);
  h('<div class="kick">Incoming packet '+(i+1)+' of '+deck.length+'</div><h2>Credible, questionable, or unreliable?</h2><div class="tcard"><b>'+c.t+'</b><div class="m">Author: '+c.by+'<br>Year: '+c.yr+'<br>Published by: '+c.src+'</div></div><div class="row" style="margin-top:14px">'+['C','Q','U'].map((x,n)=>'<button class="vb '+x+'" data-v="'+x+'">'+(n+1)+' · '+VN[x].toUpperCase()+'</button>').join('')+'</div><div id="tf" aria-live="polite"></div>');
  const ans=g=>{if(done)return;done=true;timer.stop();const sc=g===c.v?1:(g!=='C'&&c.v!=='C'?.5:0);S.G.triage+=MAX.triage/TRI*sc;stage.querySelectorAll('.vb').forEach(b=>b.disabled=true);
    const ex=mark(sc);if(sc===1&&!late&&!S.calm&&Date.now()-t0<8000){xp(25)}
    say(sc===1?'Correct. '+c.why:sc?'Close. '+c.why:'No. '+c.why,sc<1);
    $('#tf').innerHTML='<div class="fb '+(sc===1?'':sc?'mid':'bad')+'"><b>'+(sc===1?'Correct: ':sc?'Close. It is ':'It is ')+VN[c.v]+'.</b> '+c.why+ex+'</div><button class="btn" id="tn">Next packet ▶</button>';
    $('#tn').onclick=()=>triage(deck,i+1);$('#tn').focus()};
  stage.querySelectorAll('.vb').forEach(b=>b.onclick=()=>ans(b.dataset.v));
  document.onkeydown=e=>{if(document.querySelector('.ov'))return;const m={1:'C',2:'Q',3:'U'}[e.key];if(m)ans(m)};
  timer.start(22,()=>{late=true;drain(3);say('Too slow, researcher. That cost us 3% battery. Take your time now and get it right.')});
}

    let n=0;notes.forEach((nt,i)=>{const ok=+v[i]===nt[1];if(ok)n++;$('#o'+i).disabled=true;$('#of'+i).innerHTML=ok?' ✓':' ✗ belongs under <b>'+ORG.secs[nt[1]]+'</b>'});
    S.G.org=MAX.org*n/notes.length;$('#os').remove();const ex=mark(n===notes.length?1:n>=3?.5:0);

function useQ(qs,i){
  if(i===3&&!qs.br){qs.br=1;return breach(()=>useQ(qs,i))}
  if(i>=qs.length){S.lvl=5;setP(78);save();return levelDone('Level 4 complete: Write the Report',[['Integrating only credible facts (GE.b)','cloze'],['Organizing evidence (GE.b)','org'],['Integrating, quoting, and paraphrasing ethically (GE.b)','use']],'The report is honest. One job left: the Council will not accept a single claim without a proper citation.',citeIntro)}
  setP(70+8*i/qs.length);
  say(['Now combine your sources. Integration means connecting ideas, not stacking quotes.','Careful here. Plagiarism in a report gets the whole thing thrown out.','Remember: exact words need quotation marks. Your own words still need a citation.','A source can only be used to say what it actually says.','Last one for this level. Stay sharp.'][i]||'Stay sharp.');
  h('<div class="card" id="q"></div>');
  quiz($('#q'),{kick:'Responsible use '+(i+1)+' of '+qs.length,p:qs[i].p,o:qs[i].o,why:qs[i].why},f=>{S.G.use+=MAX.use/qs.length*f;useQ(qs,i+1)});
}

/* ---------- LEVEL 5: CITE IT ---------- */
function citeIntro(){apaLesson()}
function citeStart(){
  S.lvl=5;['build','spot','fill','intext','reflist'].forEach(k=>S.G[k]=0);setP(78);save();
  say('Citation protocol. A citation tells the Council exactly where each fact came from so they can check it. The APA pattern is in your Field Manual if you need it.',1);
  h('<div class="card"><div class="kick">Level 5</div><h2>Cite It</h2><ol><li><b>Build</b> APA references for two sources you saved to your disks.</li><li><b>Spot the error</b> in five damaged citations.</li><li><b>Complete</b> five citations with the missing piece.</li><li><b>Cite in the text</b> of your report.</li><li><b>Assemble</b> the reference list and transmit.</li></ol><p>The zombies are still at the door. Every error breaks a lock.</p><button class="btn" id="go">Begin ▶</button></div>');
  $('#go').onclick=()=>{const mine=S.disks.filter(k=>SITES[k].cite);const pool=shuffle(mine).concat(['JOURNAL','JHU','CDC'].filter(k=>!mine.includes(k)));
    let pick=pool.slice(0,2);if(!pick.some(k=>SITES[k].cite.length===5)){const five=pool.find(k=>SITES[k].cite.length===5);if(five)pick[1]=five}
    build(pick,0,mine)};
}
function build(ks,i,mine){
  if(i>=ks.length)return breach(()=>spot(shuffle(SPOT).slice(0,5),0));
  const s=SITES[ks[i]],right=s.cite;let pool=shuffle(right.map((t,n)=>n)),line=[],tries=0;setP(78+3*i/ks.length);
  if(pool.every((n,x)=>n===x))pool.reverse();
  say(mine.includes(ks[i])?'This one is from your own disk. Put the pieces in APA order: who, when, what, where.':'You did not save enough credible sources, so I pulled this one from the archive. Put the pieces in APA order: who, when, what, where.',1);
  h('<div class="kick">Build a reference '+(i+1)+' of '+ks.length+'</div><h2>Put the pieces in APA order: '+s.name+'</h2><div class="cit"><div>Your reference (click a piece to remove it):</div><div class="slot" id="ln" aria-live="polite"></div><div>Pieces (click to add):</div><div id="pl"></div></div><div class="row" style="margin-top:12px"><button class="btn" id="bs" disabled>Submit reference</button></div><div id="bf" aria-live="polite"></div>');
  const draw=()=>{$('#ln').innerHTML=line.map(n=>'<button class="seg" data-n="'+n+'">'+right[n]+'</button>').join(' ');$('#pl').innerHTML=pool.map(n=>'<button class="seg" data-n="'+n+'">'+right[n]+'</button>').join(' ');
    $('#ln').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;line=line.filter(x=>x!==n);pool.push(n);draw()});
    $('#pl').querySelectorAll('.seg').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;pool=pool.filter(x=>x!==n);line.push(n);draw()});
    $('#bs').disabled=pool.length>0};
  draw();
  $('#bs').onclick=()=>{const ok=line.every((n,x)=>n===x);tries++;
    if(ok||tries===2){const pts=ok?(tries===1?3:2):.5;S.G.build+=pts;const ex=mark(ok&&tries===1?1:ok?.5:0);
      say(ok?'Reference accepted. The Council can trace that source.':'Here is the correct order. Study it before the next one.',!ok);
      $('#ln').innerHTML=right.map(t=>'<span class="seg ok">'+t+'</span>').join(' ');$('#pl').innerHTML='';$('#bs').remove();
      $('#bf').innerHTML='<div class="fb '+(ok?'':'bad')+'"><b>'+(ok?'Reference accepted.':'Here is the correct order.')+'</b> APA order is <b>Author. (Year). Title. Source. URL</b>. '+(right.length===4?'When the organization is both author and publisher, you do not repeat it as the source.':'')+ex+'</div><button class="btn" id="bn">Continue ▶</button>';$('#bn').onclick=()=>build(ks,i+1,mine);$('#bn').focus()}
    else{mark(0);$('#ln').querySelectorAll('.seg').forEach((b,x)=>b.classList.add(line[x]===x?'ok':'no'));say('Not yet. Green pieces are in the right place. Think: who, when, what, where.',1);$('#bf').innerHTML='<div class="fb mid"><b>Not yet.</b> Green pieces are in the right place. Hint: <b>Author. (Year). Title. Source. URL</b>. One more try.</div>'}};
}
function spot(qs,i){
  if(i>=qs.length)return breach(()=>fill(shuffle(FILL).slice(0,5),0));
  const q=qs[i];let done=false;setP(81+5*i/qs.length);say('One piece of this citation is damaged. Click the piece with the error.');
  h('<div class="kick">Spot the error '+(i+1)+' of '+qs.length+'</div><h2>Click the part of the citation that is wrong</h2><div class="cit" id="ct">'+q.seg.map((t,n)=>'<button class="seg" data-n="'+n+'">'+t+'</button>').join(' ')+'</div><div id="sf" aria-live="polite"></div>');
  stage.querySelectorAll('#ct .seg').forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.n===q.bad;S.G.spot+=MAX.spot/qs.length*(ok?1:0);const ex=mark(ok?1:0);if(!ok)b.classList.add('no');
    say(ok?'Great work! You spotted the error.':'System failure! The error was somewhere else. Look at the fix.',!ok);
    const all=stage.querySelectorAll('#ct .seg');all.forEach(x=>x.disabled=true);all[q.bad].classList.add('ok');all[q.bad].innerHTML='<s style="color:#c0392b">'+q.seg[q.bad]+'</s> → '+q.fix;
    $('#sf').innerHTML='<div class="fb '+(ok?'':'bad')+'"><b>'+(ok?'Great work! You spotted the error.':'The error was somewhere else.')+'</b> '+q.why+ex+'</div><button class="btn" id="sn">Continue ▶</button>';$('#sn').onclick=()=>spot(qs,i+1);$('#sn').focus()});
}
function fill(qs,i){
  if(i>=qs.length)return breach(()=>intext(shuffle(INTEXT).slice(0,4),0));
  const q=qs[i];setP(86+5*i/qs.length);say('Fill the gap marked ▢ with the correctly formatted piece.',1);
  h('<div class="card" id="q"></div>');
  quiz($('#q'),{kick:'Complete the citation '+(i+1)+' of '+qs.length,p:'Which piece correctly completes this APA reference?',pre:'<div class="cit">'+q.c+'</div>',o:q.o,why:q.why},f=>{S.G.fill+=MAX.fill/qs.length*f;fill(qs,i+1)});
}
function intext(qs,i){
  if(i>=qs.length)return reflist(shuffle(REFLIST).slice(0,2),0);
  const q=qs[i];setP(91+5*i/qs.length);say(i===0?'A reference list is not enough. Every time you use a source <b>inside</b> your report, you mark it right there in the sentence.':'Same idea, different source.',1);
  h('<div class="card" id="q"></div>');
  quiz($('#q'),{kick:'Cite in the text '+(i+1)+' of '+qs.length,p:'Which in-text citation is correct?',pre:'<div class="cit">'+q.c+'</div>',o:q.o,why:q.why},f=>{S.G.intext+=MAX.intext/qs.length*f;intext(qs,i+1)});
}
function reflist(qs,i){
  if(i>=qs.length){S.lvl=6;setP(100);save(true);return final()}
  setP(96+4*i/qs.length);say(i===0?'Almost there. Assemble the reference list and I can transmit.':'Final check before transmission.');
  h('<div class="card" id="q"></div>');
  quiz($('#q'),{kick:'Assemble the reference list '+(i+1)+' of '+qs.length,p:qs[i].p,o:qs[i].o,why:qs[i].why},f=>{S.G.reflist+=MAX.reflist/qs.length*f;reflist(qs,i+1)});
}

/* ---------- FINAL ---------- */
function final(){
  const g=grade(),sum=ks=>ks.reduce((a,k)=>a+(S.G[k]||0),0),P=PATHS[S.path];
  const rank=g>=90?['Lead Researcher','Level 4 · Proficient']:g>=80?['Field Researcher','Level 3 · Developing']:g>=70?['Research Recruit','Level 2 · Beginning']:['Trainee','Level 1 · Novice'];
  const tier=g>=85?0:g>=70?1:2;
  say([ 'We did it, researcher. Uplink closing. It was an honor to work with you.','We got the report out. Run the mission again and we can do better.','My battery held, but the report did not. Review the Field Manual and try again. I will be here.'][tier]+(LMS.on()?' Your score has been sent to the gradebook.':''),tier>0);beep('win');
  const refs=S.disks.filter(k=>SITES[k].cite).map(k=>SITES[k].cite.join(' ')).sort((a,b)=>a.replace(/<[^>]+>/g,'').localeCompare(b.replace(/<[^>]+>/g,'')));
  h('<div class="kick">Report transmitted · '+P.name+'</div><h2>'+['The cure holds','A partial cure','The cure fails'][tier]+'</h2>'+evaBox('<p><b>Council verdict:</b> '+P.ends[tier]+'</p>')+
  '<div class="card" style="text-align:center"><div class="kick">Mission complete</div><h2>'+rank[0]+'</h2><div class="big">'+g+'<span style="font-size:22px">/100</span></div><p class="kick">'+rank[1]+(S.best>g?' · best score '+S.best:'')+'</p></div>'+
  '<div class="card"><h3>General Education outcome: Information Literacy</h3><table><tr><th>Outcome</th><th>Level</th><th>Points</th></tr>'+GE.map(r=>{const got=sum(r[2]),mx=r[2].reduce((a,k)=>a+MAX[k],0),pc=got/mx;return '<tr><td><b>'+r[0]+'</b> '+r[1]+'</td><td>'+(pc>=.9?'Proficient':pc>=.8?'Developing':pc>=.7?'Beginning':'Novice')+'</td><td>'+Math.round(got*10)/10+' / '+mx+'</td></tr>'}).join('')+'</table><p>Battery remaining: <b>'+S.bat+'%</b> · Intel points: <b>'+S.xp+'</b> · Zombie attacks stopped: <b>'+S.seal+' of '+S.att+'</b> · '+new Date().toLocaleString()+'</p><p class="kick">Take a picture just in case. 🧟</p></div>'+
  (refs.length?'<div class="card"><h3 style="text-align:center">References</h3><p>The credible sources you saved, in APA format and alphabetical order:</p>'+refs.map(r=>'<p class="ref">'+r+'</p>').join('')+'</div>':'')+
  (()=>{const bo=outc(S.bestG||S.G),nm=LMS.name(),bp=PATHS[S.bestPath||S.path].name,d=new Date().toLocaleString();
    const txt='Z-Virus Investigation results'+(nm?'\nStudent: '+nm:'')+'\nBest score: '+Math.max(S.best,g)+'/100 ('+bp+')\n'+bo.map(o=>o.id+' '+o.name+': '+o.got+'/'+o.mx+' ('+o.lvl+')').join('\n')+'\nRecorded: '+d;
    return '<div class="card"><h3>📋 Results for your instructor</h3><p>Copy this and paste it into the Canvas submission your instructor asks for, or take a screenshot of this box. It shows your <b>best</b> attempt, the one in the gradebook. The three outcome scores add up to that score.</p><textarea id="rTxt" aria-label="Results for your instructor" readonly rows="7" style="width:100%;font:14px var(--mono);background:#000;color:var(--grn);border:1px solid var(--line);border-radius:8px;padding:10px">'+txt+'</textarea><div class="row"><button class="btn" id="rCp">Copy results</button><span id="rOk" class="kick"></span></div></div>'})()+
  '<div class="row"><button class="btn" id="again">Play again to improve your score</button></div><p class="kick">Your highest score is the one that counts. Try a different research path: each one has its own ending.</p>');
  $('#rCp').onclick=()=>{const t=$('#rTxt');t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(()=>$('#rOk').textContent='Copied.',()=>$('#rOk').textContent='Text selected: press Ctrl+C (Cmd+C on Mac) to copy.')}else $('#rOk').textContent=ok?'Copied.':'Text selected: press Ctrl+C (Cmd+C on Mac) to copy.'};
  $('#again').onclick=()=>{const n=fresh();n.best=S.best;n.bestG=S.bestG;n.bestPath=S.bestPath;n.calm=S.calm;n.novo=S.novo;n.mute=S.mute;S=n;save();title()};
}

title();
</script>
